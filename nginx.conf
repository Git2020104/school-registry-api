events {
    worker_connections 1024;
}

http {
    upstream registry_api {
        server api:8080;
    }

    server {
        listen 80;
        server_name api.maranatha.skools;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.maranatha.skools;

        ssl_certificate /etc/letsencrypt/live/api.maranatha.skools/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.maranatha.skools/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://registry_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://registry_api/health;
            access_log off;
        }

        location /swagger {
            proxy_pass http://registry_api/swagger;
        }

        location /openapi.json {
            proxy_pass http://registry_api/openapi.json;
        }
    }
}